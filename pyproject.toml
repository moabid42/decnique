[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decnique"
version = "0.1.0"
description = "A DSL for detections and attacker techniques over one shared event model"
requires-python = ">=3.11"
dependencies = [
    "lark>=1.1",
    "pyyaml>=6.0",
    "z3-solver>=4.12",
    "rich>=13",
    "prompt_toolkit>=3",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "hypothesis>=6",
]

[project.scripts]
decnique = "decnique.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = [
    "decnique",
    "decnique.dsl",
    "decnique.model",
    "decnique.env",
    "decnique.eval",
    "decnique.smt",
    "decnique.graph",
    "decnique.ui",
    "decnique.frontends",
    "decnique.frontends.secops",
]

[tool.setuptools.package-data]
"decnique.dsl" = ["*.lark"]
"decnique" = ["catalogs/*.json"]
